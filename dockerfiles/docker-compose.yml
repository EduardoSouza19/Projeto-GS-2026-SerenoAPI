# Sobe Oracle + MongoDB + API .NET na sua máquina (mesma imagem que vai para a Azure).
# Uso (na raiz do projeto):
#   cp dockerfiles/.env.example dockerfiles/.env   (e edite as senhas)
#   docker compose -f dockerfiles/docker-compose.yml --env-file dockerfiles/.env up -d --build
services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: sereno-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: sereno
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 90s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: sereno-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile
    container_name: sereno-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "User Id=sereno;Password=${ORACLE_APP_PASSWORD};Data Source=oracle:1521/XEPDB1"
      MongoDbSettings__ConnectionString: "mongodb://mongo:27017"
      MongoDbSettings__DatabaseName: "sereno"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      oracle:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped

volumes:
  oracle_data:
    name: sereno_oracle_data
  mongo_data:
    name: sereno_mongo_data
